[project]
name = "theatrical-players-refactoring-kata"
version = "0.1.0"
description = "Practice example from chapter 1 of 'Refactoring' by Martin Fowler"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cattrs>=24.1.2",
]

[dependency-groups]
dev = [
    "approvaltests>=14.3.0",
    "pytest>=8.3.5",
    "pytest-approvaltests>=0.2.4",
    "pytest-watcher>=0.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kata"]
